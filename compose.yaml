name: smilemanager

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smilemanager}
      POSTGRES_USER: ${POSTGRES_USER:-smilemanager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smilemanager} -d ${POSTGRES_DB:-smilemanager}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [backend]

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: SmileManager.settings_local
      DATABASE_URL: postgresql://${POSTGRES_USER:-smilemanager}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-smilemanager}
    volumes:
      - media_data:/app/media
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health/ready/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [backend]

volumes:
  postgres_data:
  media_data:

networks:
  backend:
    driver: bridge
